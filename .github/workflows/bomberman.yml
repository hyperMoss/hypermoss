name: Generate Bomberman
on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/bomberman.yml"]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: bomberman
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: bomberman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
